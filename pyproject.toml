[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-tool-receipt-notary"
version = "0.1.0"
description = "Generates tamper-evident HMAC/SHA-256 hash-chained execution receipts for high-stakes agent mutations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
signed-tool-receipt-notary = "signed_tool_receipt_notary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["signed_tool_receipt_notary*"]
